<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1b2d">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Relevo · Pasa tu plaza</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root{
    --navy:#0f1b2d; --navy2:#16263d; --card:#1c2f4a; --line:#2a4366;
    --txt:#eef3fa; --muted:#9db0c9; --green:#2ecc71; --orange:#f39c12;
    --red:#e74c3c; --blue:#3d8bfd; --copper:#c8865a;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--navy);color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  #map{position:fixed;inset:0;z-index:1}
  header{position:fixed;top:0;left:0;right:0;z-index:500;
    padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;
    background:linear-gradient(var(--navy) 60%,transparent);
    display:flex;align-items:center;justify-content:space-between}
  .logo{font-weight:800;font-size:20px;letter-spacing:.5px}
  .logo span{color:var(--copper)}
  .chip{background:var(--card);border:1px solid var(--line);border-radius:20px;
    padding:6px 12px;font-size:13px;color:var(--muted);cursor:pointer}
  #sheet{position:fixed;left:0;right:0;bottom:0;z-index:600;background:var(--navy2);
    border-top-left-radius:20px;border-top-right-radius:20px;border-top:1px solid var(--line);
    padding:14px 16px calc(env(safe-area-inset-bottom) + 16px);max-height:62vh;overflow:auto;
    box-shadow:0 -8px 30px rgba(0,0,0,.4)}
  #sheet h2{margin:2px 0 6px;font-size:18px}
  #sheet p{margin:6px 0;color:var(--muted);font-size:14px;line-height:1.4}
  .btn{display:block;width:100%;border:0;border-radius:14px;padding:15px;font-size:16px;
    font-weight:700;color:#fff;background:var(--blue);margin-top:10px;cursor:pointer}
  .btn.green{background:var(--green);color:#06210f}
  .btn.orange{background:var(--orange);color:#2a1700}
  .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--txt)}
  .btn.red{background:transparent;border:1px solid var(--red);color:var(--red)}
  .btn:disabled{opacity:.5}
  .row{display:flex;gap:8px}
  .row .btn{flex:1}
  .item{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);
    border-radius:14px;padding:12px;margin-top:8px;cursor:pointer}
  .pin{width:36px;height:36px;border-radius:10px;background:var(--green);color:#06210f;
    display:flex;align-items:center;justify-content:center;font-weight:900;flex:none}
  .item .t{font-weight:700}
  .item .s{color:var(--muted);font-size:13px}
  .big{font-size:28px;font-weight:800;margin:4px 0}
  .tag{display:inline-block;padding:3px 9px;border-radius:10px;font-size:12px;font-weight:700}
  .tag.g{background:rgba(46,204,113,.15);color:var(--green)}
  .tag.o{background:rgba(243,156,18,.15);color:var(--orange)}
  .car{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0}
  .car b{color:var(--copper)}
  .opts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px}
  .opt{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 4px;
    text-align:center;font-weight:700;cursor:pointer}
  .opt.on{border-color:var(--green);color:var(--green)}
  label{display:block;font-size:13px;color:var(--muted);margin-top:10px}
  input,select{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);
    background:var(--card);color:var(--txt);font-size:16px;margin-top:4px}
  .note{font-size:12px;color:var(--muted);margin-top:12px;line-height:1.4}
  #toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 64px);transform:translateX(-50%);
    z-index:900;background:var(--copper);color:#1b0f06;font-weight:700;padding:10px 16px;border-radius:12px;
    display:none;max-width:90vw;text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.4)}
  #overlay{position:fixed;inset:0;z-index:950;background:var(--navy);display:none;overflow:auto;
    padding:calc(env(safe-area-inset-top) + 24px) 20px 30px}
  .meDot{width:18px;height:18px;border-radius:50%;background:var(--blue);border:3px solid #fff;
    box-shadow:0 0 0 6px rgba(61,139,253,.25)}
  .pMark{width:34px;height:34px;border-radius:10px;border:2px solid #fff;display:flex;align-items:center;
    justify-content:center;font-weight:900;font-size:18px;color:#06210f;box-shadow:0 3px 10px rgba(0,0,0,.4)}
  .carMark{font-size:26px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.5))}
  .leaflet-control-attribution{font-size:9px}
  .chat{background:var(--navy);border:1px solid var(--line);border-radius:14px;padding:10px;margin-top:12px}
  .chat h3{margin:0 0 6px;font-size:15px}
  .msgs{max-height:170px;overflow:auto;display:flex;flex-direction:column;gap:6px}
  .msg{max-width:82%;padding:7px 10px;border-radius:12px;font-size:14px;line-height:1.3;background:var(--card);align-self:flex-start}
  .msg.me{background:var(--blue);color:#fff;align-self:flex-end}
  .msg small{display:block;font-size:11px;opacity:.7;margin-top:2px}
  .quick{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
  .quick span{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px 10px;font-size:13px;cursor:pointer}
  .chatIn{display:flex;gap:6px}
  .chatIn input{margin:0}
  .chatIn button{border:0;border-radius:12px;background:var(--green);color:#06210f;font-weight:800;padding:0 14px;font-size:16px}
</style>
</head>
<body>
<div id="map"></div>
<header>
  <div class="logo">Relevo<span>·</span></div>
  <div class="chip" id="profileChip">Mi coche</div>
</header>
<div id="toast"></div>
<div id="sheet"></div>
<div id="overlay"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ============ CONFIGURACIÓN ============
   Pon aquí los datos de tu proyecto Supabase
   (Project Settings → API). */
const CONFIG = {
  SUPABASE_URL: "https://jyiqnmfztncuxatelezb.supabase.co",
  SUPABASE_ANON_KEY: "sb_publishable_0_pkVL7_8ItwZ7U2qu9kOA_38M_WNnt",  // clave pública (publishable)
  POLL_MS: 4000,          // cada cuánto se actualiza
  RADIO_KM: 3,            // plazas que se muestran alrededor
  ZONA_KM: 1,             // radio de la zona cuando buscas plaza
  MARGEN_MIN: 5,          // margen de hora al buscar (± minutos)
  COSTE: 5,               // puntos que cuesta apartar una plaza
  PREMIO: 10,             // puntos que gana quien deja su plaza (cuando el otro aparca)
  PRIORIDAD_MIN: 2,       // minutos que las plazas nuevas solo las ven quienes ya han dejado alguna
  PIN_MAX_M: 75,          // cuánto puedes mover el pin respecto a tu GPS
  CADUCA_MIN: 60          // una plaza publicada caduca a los 60 min
};
/* ====================================== */

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const store = {
  get(k, d){ try{ const v = localStorage.getItem("relevo_"+k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem("relevo_"+k, JSON.stringify(v)); }catch(e){} },
  del(k){ try{ localStorage.removeItem("relevo_"+k); }catch(e){} }
};

let sb = null;
let me = store.get("me", null);
if (me && !me.id) me.id = crypto.randomUUID();
let pos = null;            // {lat,lng,acc}
let manualPos = false;
let plazas = [];
let myPlazaId = store.get("myPlaza", null);   // plaza que yo dejo
let myTakeId  = store.get("myTake", null);    // plaza que yo he apartado
let carPos    = store.get("carPos", null);    // dónde aparqué mi coche {lat,lng,at}
let busqueda  = store.get("busqueda", null);  // filtro activo {lat,lng,at(ISO)}
let buscando  = null;      // editando búsqueda {lat,lng,hora}
let searchMarker = null;
let confirmar = false;
let perfil = null, reput = {};   // mis puntos y la reputación de otros
let chatMsgs = [], chatPlaza = null, chatSeen = store.get("chatSeen", {}), chatDraft = "", chatFocus = false;
let selected = null;       // plaza tocada en el mapa
let publishing = null;     // {min, hora, lat, lng}
let lastStatus = {};       // para detectar cambios y avisar
let pollTimer = null, lastPush = 0;

/* ---------- Mapa ---------- */
const map = L.map("map", { zoomControl:false, attributionControl:true }).setView([41.48, 1.93], 15);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom: 19, attribution: "© OpenStreetMap"
}).addTo(map);
const meMarker = L.marker([0,0], { icon: L.divIcon({ className:"", html:'<div class="meDot"></div>', iconSize:[18,18] }) });
const layer = L.layerGroup().addTo(map);
const myCarIcon = L.divIcon({ className:"", html:'<div class="pMark" style="background:#c8865a">🚗</div>', iconSize:[34,34], iconAnchor:[17,17] });
let pubMarker = null;
let centered = false;

map.on("click", e => {
  if (buscando && searchMarker) { searchMarker.setLatLng(e.latlng); buscando.lat = e.latlng.lat; buscando.lng = e.latlng.lng; return; }
  if (publishing && pubMarker) { moverPin(e.latlng); return; }
  if (manualPos) { setPos(e.latlng.lat, e.latlng.lng, 5); toast("Posición fijada a mano"); }
});

function pMarker(color, txt){
  return L.divIcon({ className:"", html:`<div class="pMark" style="background:${color}">${txt}</div>`, iconSize:[34,34], iconAnchor:[17,17] });
}
const carIcon = L.divIcon({ className:"", html:'<div class="carMark">🚗</div>', iconSize:[28,28], iconAnchor:[14,14] });

/* ---------- Utilidades ---------- */
function distM(a, b){
  const R = 6371000, toR = x => x*Math.PI/180;
  const dLat = toR(b.lat-a.lat), dLng = toR(b.lng-a.lng);
  const h = Math.sin(dLat/2)**2 + Math.cos(toR(a.lat))*Math.cos(toR(b.lat))*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}
const fmtDist = m => m < 1000 ? Math.round(m) + " m" : (m/1000).toFixed(1) + " km";
const etaMin = m => Math.max(1, Math.round(m / (22000/60))); // ~22 km/h en ciudad
function horaTxt(iso){ return new Date(iso).toLocaleTimeString("es-ES", { hour:"2-digit", minute:"2-digit" }); }
function minsTo(iso){ return Math.round((new Date(iso) - Date.now())/60000); }
function salidaTxt(p){
  if (p.owner_left) return "Ya ha salido";
  const m = minsTo(p.leave_at);
  if (m <= 0) return "Sale ahora";
  if (m > 60) return "Sale a las " + horaTxt(p.leave_at);
  return `Sale en ${m} min (${horaTxt(p.leave_at)})`;
}
function carTxt(c){
  if (!c) return "";
  return [c.modelo, c.color].filter(Boolean).join(" · ") + (c.matricula ? " · " + c.matricula : "");
}

let actx = null;
function beep(){
  try{
    if (!actx) actx = new (window.AudioContext||window.webkitAudioContext)();
    [0, .18].forEach(t => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.frequency.value = 880; o.connect(g); g.connect(actx.destination);
      g.gain.setValueAtTime(.2, actx.currentTime+t); g.gain.exponentialRampToValueAtTime(.001, actx.currentTime+t+.15);
      o.start(actx.currentTime+t); o.stop(actx.currentTime+t+.16);
    });
  }catch(e){}
  try{ navigator.vibrate && navigator.vibrate([200,100,200]); }catch(e){}
}
document.addEventListener("click", () => { if (!actx) try{ actx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }, { once:true });

let toastT;
function toast(msg, ms=3500){
  const t = $("#toast"); t.textContent = msg; t.style.display = "block";
  clearTimeout(toastT); toastT = setTimeout(() => t.style.display = "none", ms);
}

/* ---------- GPS ---------- */
function setPos(lat, lng, acc){
  pos = { lat, lng, acc };
  meMarker.setLatLng([lat, lng]).addTo(map);
  if (!centered){ map.setView([lat, lng], 17); centered = true; }
  render();
}
function startGPS(){
  if (!navigator.geolocation){ gpsFail("Este móvil no tiene GPS disponible."); return; }
  navigator.geolocation.watchPosition(
    p => { manualPos = false; setPos(p.coords.latitude, p.coords.longitude, p.coords.accuracy); },
    e => gpsFail(e.code === 1 ? "Has denegado el permiso de ubicación." : "No se pudo obtener tu ubicación."),
    { enableHighAccuracy:true, maximumAge:3000, timeout:15000 }
  );
}
function gpsFail(msg){
  if (pos) return;
  manualPos = true;
  toast(msg + " Toca el mapa para marcar dónde estás.", 6000);
  render();
}

/* ---------- Puntos ---------- */
async function loadPerfil(){
  if (!me || !sb) return;
  const antes = perfil;
  const { data, error } = await sb.rpc("relevo_usuario", { p_id: me.id, p_nombre: me.name });
  if (error){ console.warn(error); return; }
  perfil = data;
  if (antes && perfil.dadas > antes.dadas){
    beep(); toast(`⭐ +${CONFIG.PREMIO} puntos por dejar tu plaza. Tienes ${perfil.puntos}: puedes apartar ${Math.floor(perfil.puntos/CONFIG.COSTE)} plazas cuando vuelvas.`, 8000);
  } else if (antes && perfil.falsas > antes.falsas){
    toast("⚠️ Te han avisado de que no había plaza. Pierdes 10 puntos.", 8000);
  }
}
async function loadReput(){
  const ids = [...new Set(plazas.map(p => p.owner_id))].filter(id => !reput[id] || Date.now() - reput[id]._t > 60000);
  if (!ids.length) return;
  const { data } = await sb.from("usuarios").select("id,dadas,falsas").in("id", ids);
  (data || []).forEach(u => reput[u.id] = { ...u, _t: Date.now() });
}
function reputTxt(id){
  const r = reput[id];
  if (!r) return "Conductor nuevo";
  return `Ha dejado ${r.dadas} plaza${r.dadas === 1 ? "" : "s"} · ${r.falsas ? "⚠️ " + r.falsas + " aviso" + (r.falsas === 1 ? "" : "s") : "0 avisos"}`;
}
function puedoVer(p){   // prioridad: las plazas recién publicadas las ven antes quienes ya han dejado alguna
  if (p.owner_id === me?.id || p.id === myTakeId) return true;
  if (perfil && perfil.dadas > 0) return true;
  return Date.now() - new Date(p.created_at) > CONFIG.PRIORIDAD_MIN*60000;
}

/* ---------- Supabase ---------- */
async function loadPlazas(){
  const since = new Date(Date.now() - CONFIG.CADUCA_MIN*60000).toISOString();
  const { data, error } = await sb.from("plazas").select("*").gte("leave_at", since);
  if (error){ console.warn(error); return; }
  plazas = data || [];

  // ¿siguen existiendo mis cosas?
  if (myPlazaId && !plazas.find(p => p.id === myPlazaId)){ myPlazaId = null; store.del("myPlaza"); }
  if (myTakeId){
    const t = plazas.find(p => p.id === myTakeId);
    if (!t){ myTakeId = null; store.del("myTake"); toast(`La plaza que ibas a coger ya no está disponible. Te devolvemos tus ${CONFIG.COSTE} puntos.`); beep(); }
    else if (t.taker_id !== me?.id){ myTakeId = null; store.del("myTake"); toast("El conductor ha liberado la reserva."); }
  }
  notifyChanges();
  await Promise.all([loadChat(), loadPerfil(), loadReput()]);
  render();
  pushMyPosition();
}

function notifyChanges(){
  plazas.forEach(p => {
    const key = p.status + "|" + p.owner_left + "|" + p.taker_id;
    const prev = lastStatus[p.id];
    if (prev && prev !== key){
      if (p.id === myPlazaId && p.status === "apartada" && !prev.startsWith("apartada")){
        beep(); toast(`🚗 ${p.taker_name || "Alguien"} viene a por tu plaza`);
      }
      if (p.id === myPlazaId && p.status === "libre" && prev.startsWith("apartada")){
        toast("La otra persona ha cancelado. Tu plaza vuelve a estar publicada.");
      }
      if (p.id === myTakeId && p.owner_left && !prev.includes("|true|")){
        beep(); toast("✅ ¡Ya ha salido! La plaza está libre.");
      }
    }
    lastStatus[p.id] = key;
  });
}

async function pushMyPosition(){
  if (!myTakeId || !pos || Date.now() - lastPush < 8000) return;
  lastPush = Date.now();
  await sb.from("plazas").update({ taker_lat: pos.lat, taker_lng: pos.lng, taker_at: new Date().toISOString() })
    .eq("id", myTakeId).eq("taker_id", me.id);
}

function salidaDate(){
  if (publishing.min !== "hora") return new Date(Date.now() + publishing.min*60000);
  if (!publishing.hora) return null;
  const [h, mm] = publishing.hora.split(":").map(Number);
  if (isNaN(h)) return null;
  const d = new Date(); d.setHours(h, mm, 0, 0);
  if (d < Date.now() - 5*60000) d.setDate(d.getDate() + 1);   // hora ya pasada → mañana
  return d;
}
async function publicar(){
  const { lat, lng } = publishing;
  const salida = salidaDate();
  if (!salida){ toast("Elige a qué hora sales"); return; }
  if (salida - Date.now() > 12*3600000){ toast("Como mucho puedes avisar con 12 horas de antelación"); return; }
  const btn = $("#pubOk"); if (btn) btn.disabled = true;
  const { data, error } = await sb.from("plazas").insert({
    owner_id: me.id, owner_name: me.name, owner_car: me.car,
    lat, lng, leave_at: salida.toISOString(), status: "libre"
  }).select().single();
  if (error){ toast("Error al publicar: " + error.message); if (btn) btn.disabled = false; return; }
  myPlazaId = data.id; store.set("myPlaza", myPlazaId);
  cancelPublish();
  toast("Plaza publicada. Te avisaremos cuando alguien la aparte.");
  loadPlazas();
}

async function apartar(p){
  await loadPerfil();
  const { data, error } = await sb.rpc("relevo_apartar", { p_plaza: p.id, p_user: me.id, p_nombre: me.name, p_car: me.car,
    p_lat: pos?.lat ?? null, p_lng: pos?.lng ?? null });
  if (error){ toast("Error: " + error.message); return; }
  if (data === "sin_puntos"){ toast(`Necesitas ${CONFIG.COSTE} puntos para apartar. Deja tu plaza cuando te vayas y gana ${CONFIG.PREMIO}.`, 7000); return; }
  if (data !== "ok"){ toast("Vaya, otra persona la ha apartado antes."); selected = null; loadPlazas(); return; }
  myTakeId = p.id; store.set("myTake", myTakeId); selected = null;
  lastPush = 0;
  toast("¡Apartada! Ve hacia allí, el conductor ya sabe que vas.");
  loadPlazas();
}

async function soltarReserva(){
  if (!myTakeId) return;
  await sb.rpc("relevo_soltar", { p_plaza: myTakeId, p_user: me.id });
  myTakeId = null; store.del("myTake");
  toast(`Reserva anulada. Te devolvemos tus ${CONFIG.COSTE} puntos.`); loadPlazas();
}
async function heAparcado(){
  if (!myTakeId) return;
  const t = plazas.find(p => p.id === myTakeId);
  if (t) guardarCoche(t.lat, t.lng);
  await sb.rpc("relevo_completar", { p_plaza: myTakeId, p_user: me.id });   // se borra todo, incluidas ubicaciones
  myTakeId = null; store.del("myTake");
  toast(`¡Perfecto! Relevo completado 🙌 ${t?.owner_name || "El otro conductor"} gana ${CONFIG.PREMIO} puntos.`); loadPlazas();
}
async function noHabiaPlaza(){
  if (!myTakeId) return;
  if (!confirmar){ confirmar = true; render(); return; }
  confirmar = false;
  await sb.rpc("relevo_denunciar", { p_plaza: myTakeId, p_user: me.id });
  myTakeId = null; store.del("myTake");
  toast(`Lo sentimos. Te devolvemos tus ${CONFIG.COSTE} puntos y avisamos al otro conductor.`, 6000); loadPlazas();
}
async function yaHeSalido(){
  if (!myPlazaId) return;
  const p = plazas.find(x => x.id === myPlazaId);
  olvidarCoche();
  if (p && p.status === "libre"){ await borrarMiPlaza(); toast("Has salido. Plaza retirada."); return; }
  await sb.from("plazas").update({ owner_left:true }).eq("id", myPlazaId);
  toast("Avisado: ya puede aparcar."); loadPlazas();
}
async function borrarMiPlaza(){
  if (!myPlazaId) return;
  const p = plazas.find(x => x.id === myPlazaId);
  if (p && p.taker_id) await sb.rpc("relevo_soltar", { p_plaza: myPlazaId, p_user: me.id });   // devuelve sus puntos al otro
  else await sb.from("plazas").delete().eq("id", myPlazaId);
  myPlazaId = null; store.del("myPlaza"); loadPlazas();
}

/* ---------- Chat entre los dos conductores ---------- */
function chatActivo(){
  const mine = plazas.find(p => p.id === myPlazaId && p.status === "apartada");
  if (mine) return mine.id;
  const take = plazas.find(p => p.id === myTakeId);
  return take ? take.id : null;
}
async function loadChat(){
  const id = chatActivo();
  if (id !== chatPlaza){ chatPlaza = id; chatMsgs = []; }
  if (!id) return;
  const { data, error } = await sb.from("mensajes").select("*").eq("plaza_id", id).order("created_at");
  if (error){ console.warn(error); return; }
  chatMsgs = data || [];
  const nuevos = chatMsgs.filter(m => m.author_id !== me?.id && (!chatSeen[id] || m.created_at > chatSeen[id]));
  if (nuevos.length){
    const u = nuevos[nuevos.length-1];
    beep(); toast(`💬 ${u.author_name || "El otro conductor"}: ${u.texto}`, 6000);
    chatSeen[id] = u.created_at; store.set("chatSeen", chatSeen);
  }
}
async function enviarMsg(texto){
  texto = (texto || "").trim().slice(0, 300);
  if (!texto || !chatPlaza) return;
  chatDraft = "";
  const { error } = await sb.from("mensajes").insert({ plaza_id: chatPlaza, author_id: me.id, author_name: me.name, texto });
  if (error){ toast("No se pudo enviar: " + error.message); return; }
  await loadChat(); render();
}
function chatHTML(soyDueno){
  const rapidos = soyDueno
    ? ["Ya estoy en el coche", "Salgo en 5 min", "Me retraso un poco", "Ya he salido"]
    : ["Voy de camino", "Llego en 5 min", "Ya estoy aquí", "No encuentro el coche"];
  return `<div class="chat"><h3>💬 Chat con el otro conductor</h3>
    <div class="msgs" id="msgs">${chatMsgs.length ? chatMsgs.map(m => `<div class="msg ${m.author_id === me.id ? "me" : ""}">${esc(m.texto)}<small>${m.author_id === me.id ? "Tú" : esc(m.author_name || "Conductor")} · ${horaTxt(m.created_at)}</small></div>`).join("") : `<p style="margin:0">Avisa aquí de cualquier problema o cambio.</p>`}</div>
    <div class="quick">${rapidos.map(t => `<span data-q="${esc(t)}">${esc(t)}</span>`).join("")}</div>
    <div class="chatIn"><input id="chatIn" maxlength="300" placeholder="Escribe un mensaje…"><button id="chatSend">➤</button></div></div>`;
}
function bindChat(){
  const box = $("#msgs"); if (!box) return;
  box.scrollTop = box.scrollHeight;
  const inp = $("#chatIn");
  inp.value = chatDraft;
  if (chatFocus){ inp.focus(); inp.setSelectionRange(chatDraft.length, chatDraft.length); }
  inp.oninput = e => chatDraft = e.target.value;
  inp.onfocus = () => chatFocus = true;
  inp.onblur = () => setTimeout(() => { if (document.activeElement !== $("#chatIn")) chatFocus = false; }, 0);
  inp.onkeydown = e => { if (e.key === "Enter") enviarMsg(inp.value); };
  $("#chatSend").onclick = () => enviarMsg(inp.value);
  document.querySelectorAll(".quick span").forEach(q => q.onclick = () => enviarMsg(q.dataset.q));
}

/* ---------- Publicar (elegir minutos y ajustar pin) ---------- */
function guardarCoche(lat, lng){
  carPos = { lat, lng, at: new Date().toISOString() }; store.set("carPos", carPos);
}
function heAparcadoAqui(){
  if (!pos){ toast(manualPos ? "Primero toca el mapa para marcar dónde estás." : "Esperando al GPS…"); return; }
  guardarCoche(pos.lat, pos.lng);
  toast("📍 Guardado dónde has aparcado. ¿A qué hora sales?"); startPublish(); if (publishing){ publishing.min = "hora"; render(); }
}
function olvidarCoche(){ carPos = null; store.del("carPos"); }
function startPublish(){
  const base = carPos || pos;
  if (!base){ toast(manualPos ? "Primero toca el mapa para marcar dónde estás." : "Esperando al GPS…"); return; }
  publishing = { min: 0, hora: "", lat: base.lat, lng: base.lng };
  pubMarker = L.marker([base.lat, base.lng], { draggable:true, icon: pMarker("#2ecc71","P") }).addTo(map);
  publishing.base = { lat: base.lat, lng: base.lng };
  pubMarker.on("dragend", e => moverPin(e.target.getLatLng()));
  map.setView([base.lat, base.lng], 18);
  render();
}
function moverPin(ll){
  if (distM(publishing.base, { lat: ll.lat, lng: ll.lng }) > CONFIG.PIN_MAX_M){
    toast(`Solo puedes ajustar el pin unos metros. La plaza tiene que estar donde está tu coche.`);
    pubMarker.setLatLng([publishing.lat, publishing.lng]); return;
  }
  pubMarker.setLatLng(ll); publishing.lat = ll.lat; publishing.lng = ll.lng;
}
function cancelPublish(){
  publishing = null;
  if (pubMarker){ map.removeLayer(pubMarker); pubMarker = null; }
  render();
}

/* ---------- Buscar plaza (zona + hora) ---------- */
function horaADate(hhmm){
  if (!hhmm) return null;
  const [h, mm] = hhmm.split(":").map(Number);
  if (isNaN(h)) return null;
  const d = new Date(); d.setHours(h, mm, 0, 0);
  if (d < Date.now() - 30*60000) d.setDate(d.getDate() + 1);
  return d;
}
function startSearch(){
  const base = busqueda || pos;
  if (!base){ toast(manualPos ? "Primero toca el mapa para marcar dónde estás." : "Esperando al GPS…"); return; }
  const h = busqueda ? new Date(busqueda.at) : new Date(Date.now() + 15*60000);
  buscando = { lat: base.lat, lng: base.lng, hora: h.toTimeString().slice(0,5) };
  searchMarker = L.marker([base.lat, base.lng], { draggable:true, icon: pMarker("#3d8bfd","🔍") }).addTo(map);
  searchMarker.on("dragend", e => { const ll = e.target.getLatLng(); buscando.lat = ll.lat; buscando.lng = ll.lng; });
  map.setView([base.lat, base.lng], 15);
  render();
}
function endSearchEdit(){
  buscando = null;
  if (searchMarker){ map.removeLayer(searchMarker); searchMarker = null; }
  render();
}
function aplicarBusqueda(){
  const d = horaADate(buscando.hora);
  if (!d){ toast("Elige a qué hora necesitas aparcar"); return; }
  busqueda = { lat: buscando.lat, lng: buscando.lng, at: d.toISOString() }; store.set("busqueda", busqueda);
  endSearchEdit();
}
function quitarBusqueda(){ busqueda = null; store.del("busqueda"); render(); }
function encaja(p){   // ¿la plaza encaja con la búsqueda activa?
  if (!busqueda) return true;
  if (distM(busqueda, p) > CONFIG.ZONA_KM*1000) return false;
  return Math.abs(new Date(p.leave_at) - new Date(busqueda.at)) <= CONFIG.MARGEN_MIN*60000;
}

/* ---------- Pintar ---------- */
function drawMap(){
  layer.clearLayers();
  if (carPos && !publishing && !myPlazaId) L.marker([carPos.lat, carPos.lng], { icon: myCarIcon }).addTo(layer);
  plazas.forEach(p => {
    const mine = p.id === myPlazaId, taking = p.id === myTakeId;
    if (!mine && !taking && (p.status !== "libre" || !puedoVer(p))) return;
    if (!mine && !taking && busqueda && !encaja(p)) return;
    if (!mine && !taking && !busqueda && pos && distM(pos, p) > CONFIG.RADIO_KM*1000) return;
    const color = mine ? "#c8865a" : taking ? "#f39c12" : "#2ecc71";
    const m = L.marker([p.lat, p.lng], { icon: pMarker(color, "P") }).addTo(layer);
    if (!mine && !taking) m.on("click", () => { selected = p.id; render(); });
    if ((mine || taking) && p.status === "apartada" && p.taker_lat != null && mine){
      L.marker([p.taker_lat, p.taker_lng], { icon: carIcon }).addTo(layer);
      L.polyline([[p.taker_lat, p.taker_lng],[p.lat, p.lng]], { color:"#f39c12", dashArray:"6 8", weight:3 }).addTo(layer);
    }
    if (taking && pos){
      L.polyline([[pos.lat, pos.lng],[p.lat, p.lng]], { color:"#f39c12", dashArray:"6 8", weight:3 }).addTo(layer);
    }
  });
}

function render(){
  drawMap();
  const s = $("#sheet");
  $("#profileChip").textContent = (perfil ? "⭐ " + perfil.puntos + " · " : "") + (me ? (me.car?.matricula || me.name || "Mi coche") : "Mi coche");

  if (!sb){
    s.innerHTML = `<h2>Falta configurar</h2>
      <p>Abre <b>index.html</b> y rellena <b>SUPABASE_URL</b> y <b>SUPABASE_ANON_KEY</b> en el bloque CONFIGURACIÓN. Después crea la tabla con el archivo <b>supabase.sql</b>.</p>`;
    return;
  }

  // 0) Estoy eligiendo zona y hora para buscar
  if (buscando){
    s.innerHTML = `<h2>Busco plaza</h2>
      <p>Mueve el pin <b>🔍</b> (o toca el mapa) a la zona donde quieres aparcar.</p>
      <label>¿A qué hora necesitas aparcar?</label>
      <input type="time" id="bHora" value="${esc(buscando.hora)}">
      <p class="note" style="margin-top:6px">Verás los coches que salen a ${CONFIG.ZONA_KM} km o menos de ese punto, entre ${CONFIG.MARGEN_MIN} min antes y ${CONFIG.MARGEN_MIN} min después de esa hora.</p>
      <button class="btn green" id="bOk">Buscar</button>
      <button class="btn ghost" id="bCancel">Cancelar</button>`;
    $("#bHora").oninput = e => buscando.hora = e.target.value;
    $("#bOk").onclick = aplicarBusqueda; $("#bCancel").onclick = endSearchEdit;
    return;
  }

  // 1) Estoy publicando
  if (publishing){
    const opc = [0,5,10,15,30,60,"hora"];
    s.innerHTML = `<h2>Dejar mi plaza</h2>
      <p>${carPos ? "El pin <b>P</b> está donde guardaste tu coche." : "El pin <b>P</b> está donde estás ahora."} Arrástralo (o toca el mapa) si no está justo en tu coche.</p>
      <label>¿Cuándo sales?</label>
      <div class="opts">${opc.map(m => `<div class="opt ${publishing.min===m?"on":""}" data-min="${m}" ${m==="hora"?'style="grid-column:span 2"':""}>${m===0?"Ya":m==="hora"?"🕒 A una hora":m+" min"}</div>`).join("")}</div>
      ${publishing.min === "hora" ? `<label>Hora de salida</label><input type="time" id="pubHora" value="${esc(publishing.hora)}">` : ""}
      <p id="pubResumen" style="color:var(--txt)"></p>
      <button class="btn green" id="pubOk">Publicar plaza</button>
      <button class="btn ghost" id="pubCancel">Cancelar</button>
      <div class="note">Cuando alguien la coja y aparque, ganarás <b>${CONFIG.PREMIO} puntos</b> ⭐ para aparcar tú después. Es un aviso entre conductores, no una reserva oficial. Siempre gratis.</div>`;
    const resumen = () => { const d = salidaDate(); $("#pubResumen").textContent = d ? "Saldrás a las " + horaTxt(d) + (d.getDate() !== new Date().getDate() ? " (mañana)" : "") : ""; };
    s.querySelectorAll(".opt").forEach(o => o.onclick = () => {
      const v = o.dataset.min; publishing.min = v === "hora" ? "hora" : +v;
      if (v === "hora" && !publishing.hora){ const d = new Date(Date.now() + 30*60000); publishing.hora = d.toTimeString().slice(0,5); }
      render();
    });
    $("#pubHora") && ($("#pubHora").oninput = e => { publishing.hora = e.target.value; resumen(); });
    resumen();
    $("#pubOk").onclick = publicar; $("#pubCancel").onclick = cancelPublish;
    return;
  }

  // 2) Yo dejo mi plaza
  const mine = plazas.find(p => p.id === myPlazaId);
  if (mine){
    if (mine.status === "libre"){
      s.innerHTML = `<span class="tag g">PUBLICADA</span>
        <h2>Esperando a que alguien la aparte…</h2>
        <p>${salidaTxt(mine)}. Te sonará el móvil cuando alguien la coja.</p>
        <div class="row"><button class="btn ghost" id="mLeft">Ya me he ido</button><button class="btn red" id="mDel">Retirar</button></div>`;
    } else {
      const d = mine.taker_lat != null ? distM({lat:mine.taker_lat,lng:mine.taker_lng}, mine) : null;
      s.innerHTML = `<span class="tag o">${mine.owner_left ? "HAS SALIDO" : "APARTADA"}</span>
        <h2>${esc(mine.taker_name || "Alguien")} viene a por tu plaza</h2>
        <div class="car">🚗 ${esc(carTxt(mine.taker_car)) || "Coche sin datos"}</div>
        ${d!=null ? `<div class="big">${fmtDist(d)} <span style="font-size:16px;color:var(--muted)">· ~${etaMin(d)} min</span></div>` : `<p>Esperando su ubicación…</p>`}
        ${mine.owner_left
          ? `<p>Le hemos avisado de que ya está libre. Cuando aparque, se cerrará solo.</p><button class="btn ghost" id="mDel">Terminar</button>`
          : `<p>Cuando llegue (o justo al salir), pulsa <b>Ya he salido</b>.</p>
             <button class="btn orange" id="mLeft">Ya he salido</button><button class="btn red" id="mDel">Cancelar</button>`}
        ${chatHTML(true)}`;
      bindChat();
    }
    $("#mLeft") && ($("#mLeft").onclick = yaHeSalido);
    $("#mDel") && ($("#mDel").onclick = borrarMiPlaza);
    return;
  }

  // 3) Yo voy a por una plaza
  const take = plazas.find(p => p.id === myTakeId);
  if (take){
    const d = pos ? distM(pos, take) : null;
    s.innerHTML = `<span class="tag o">APARTADA PARA TI</span>
      <h2>Plaza de ${esc(take.owner_name || "un conductor")}</h2>
      <div class="car">Busca este coche: <b>${esc(carTxt(take.owner_car)) || "sin datos"}</b></div>
      ${d!=null ? `<div class="big">${fmtDist(d)} <span style="font-size:16px;color:var(--muted)">· ~${etaMin(d)} min</span></div>` : ""}
      <p><b style="color:${take.owner_left?"var(--green)":"var(--orange)"}">${salidaTxt(take)}</b></p>
      <a class="btn" style="text-align:center;text-decoration:none" target="_blank" rel="noopener"
         href="https://www.google.com/maps/dir/?api=1&destination=${take.lat},${take.lng}&travelmode=driving">🧭 Cómo llegar</a>
      <div class="row"><button class="btn green" id="tPark">He aparcado</button><button class="btn red" id="tDrop">Ya no la quiero</button></div>
      ${confirmar
        ? `<div class="car" style="border-color:var(--red)">¿Seguro que <b>no había plaza</b>? Al otro conductor se le quitarán 10 puntos.
             <div class="row"><button class="btn red" id="tFake">Sí, no había</button><button class="btn ghost" id="tFakeNo">No, me he equivocado</button></div></div>`
        : `<button class="btn ghost" id="tFake">🚫 He llegado y no había plaza</button>`}
      ${chatHTML(false)}`;
    bindChat();
    $("#tPark").onclick = heAparcado; $("#tDrop").onclick = soltarReserva; $("#tFake").onclick = noHabiaPlaza;
    $("#tFakeNo") && ($("#tFakeNo").onclick = () => { confirmar = false; render(); });
    return;
  }

  // 4) Detalle de una plaza tocada
  const sel = plazas.find(p => p.id === selected && p.status === "libre");
  if (sel){
    const d = pos ? distM(pos, sel) : null;
    s.innerHTML = `<span class="tag g">LIBRE</span>
      <h2>Plaza de ${esc(sel.owner_name || "un conductor")}</h2>
      <p>${salidaTxt(sel)}${d!=null ? " · a " + fmtDist(d) + " (~" + etaMin(d) + " min)" : ""}</p>
      <div class="car">Coche que sale: <b>${esc(carTxt(sel.owner_car)) || "sin datos"}</b>${sel.owner_car?.tamano ? " · tamaño " + esc(sel.owner_car.tamano) : ""}</div>
      <p>👤 ${esc(reputTxt(sel.owner_id))}</p>
      <button class="btn green" id="sTake">La quiero · ${CONFIG.COSTE} ⭐</button>
      <p class="note" style="margin-top:6px">Tienes ${perfil ? perfil.puntos : "—"} puntos. Si al llegar no hay plaza, te los devolvemos.</p>
      <button class="btn ghost" id="sBack">Volver</button>`;
    $("#sTake").onclick = () => apartar(sel); $("#sBack").onclick = () => { selected = null; render(); };
    return;
  }

  // 5) Inicio
  const ref = busqueda || pos;
  const libres = plazas.filter(p => p.status === "libre" && p.owner_id !== me?.id && puedoVer(p))
    .filter(encaja)
    .map(p => ({ p, d: ref ? distM(ref, p) : null }))
    .filter(x => busqueda || x.d == null || x.d <= CONFIG.RADIO_KM*1000)
    .sort((a,b) => busqueda ? (new Date(a.p.leave_at) - new Date(b.p.leave_at)) : ((a.d??0) - (b.d??0)));
  s.innerHTML = `
    ${manualPos ? `<p>📍 Sin GPS: toca el mapa para marcar dónde estás.</p>` : (!pos ? `<p>Buscando tu ubicación…</p>` : "")}
    ${carPos
      ? `<div class="car">🚗 Tu coche: aparcado a las <b>${horaTxt(carPos.at)}</b>${pos ? " · a " + fmtDist(distM(pos, carPos)) : ""}
           <div class="row" style="margin-top:6px"><button class="btn ghost" id="goCar" style="margin-top:0;padding:10px">Ver en mapa</button><button class="btn ghost" id="carForget" style="margin-top:0;padding:10px">Olvidar</button></div></div>`
      : `<button class="btn" id="goPark">📍 He aparcado aquí</button>`}
    <div class="row"><button class="btn green" id="goPub">🚗 Dejo mi plaza</button><button class="btn" id="goSearch">🔍 Busco plaza</button></div>
    ${busqueda
      ? `<h2 style="margin-top:16px">Salen a las ${horaTxt(busqueda.at)} ±${CONFIG.MARGEN_MIN} min (${libres.length})</h2>
         <p>En la zona que elegiste (${CONFIG.ZONA_KM} km). <a href="#" id="bEdit" style="color:var(--blue)">Cambiar</a> · <a href="#" id="bClear" style="color:var(--blue)">Ver todas</a></p>`
      : `<h2 style="margin-top:16px">Plazas cerca (${libres.length})</h2>`}
    ${perfil && perfil.dadas === 0 ? `<p class="note" style="margin-top:0">⭐ Quien ya ha dejado alguna plaza ve las nuevas ${CONFIG.PRIORIDAD_MIN} min antes. Deja la tuya al irte y tendrás prioridad.</p>` : ""}
    ${libres.length ? libres.map(({p,d}) => `
      <div class="item" data-id="${p.id}">
        <div class="pin">P</div>
        <div style="flex:1"><div class="t">${d!=null ? fmtDist(d) : "—"} · ${esc(salidaTxt(p))}</div>
        <div class="s">${esc(carTxt(p.owner_car)) || "Coche sin datos"}</div></div>
      </div>`).join("") : (busqueda ? `<p>Nadie sale a esa hora en esa zona todavía. Déjalo abierto: si alguien publica una plaza que encaje, aparecerá aquí.</p>` : `<p>Ahora mismo nadie está dejando plaza por aquí. Cuando alguien publique una, aparecerá en verde.</p>`)}`;
  $("#goPub").onclick = startPublish;
  $("#goSearch").onclick = startSearch;
  $("#bEdit") && ($("#bEdit").onclick = e => { e.preventDefault(); startSearch(); });
  $("#bClear") && ($("#bClear").onclick = e => { e.preventDefault(); quitarBusqueda(); });
  $("#goPark") && ($("#goPark").onclick = heAparcadoAqui);
  $("#goCar") && ($("#goCar").onclick = () => map.setView([carPos.lat, carPos.lng], 18));
  $("#carForget") && ($("#carForget").onclick = () => { olvidarCoche(); render(); });
  s.querySelectorAll(".item").forEach(it => it.onclick = () => {
    selected = it.dataset.id; const p = plazas.find(x => x.id === selected);
    if (p) map.setView([p.lat, p.lng], 17); render();
  });
}

/* ---------- Perfil ---------- */
function showProfile(first){
  const o = $("#overlay"), c = me?.car || {};
  o.innerHTML = `<div class="logo" style="font-size:28px">Relevo<span>·</span></div>
    <p style="color:var(--muted)">${first ? "Pasa tu plaza de la calle a otro conductor, sin dar vueltas. Antes de empezar, dinos cómo es tu coche para que te reconozcan." : "Tus datos"}</p>
    <label>Tu nombre o apodo</label><input id="fName" maxlength="20" value="${esc(me?.name||"")}">
    <label>Modelo del coche</label><input id="fModelo" maxlength="30" placeholder="Ej: SEAT León" value="${esc(c.modelo||"")}">
    <label>Color</label><input id="fColor" maxlength="20" placeholder="Ej: Rojo" value="${esc(c.color||"")}">
    <label>Matrícula (opcional, ayuda a reconocerlo)</label><input id="fMat" maxlength="10" placeholder="1234ABC" value="${esc(c.matricula||"")}">
    <label>Tamaño</label>
    <select id="fTam">${["Pequeño","Mediano","Grande","Furgoneta"].map(t => `<option ${c.tamano===t?"selected":""}>${t}</option>`).join("")}</select>
    <button class="btn green" id="fSave">Guardar</button>
    ${first ? "" : `<button class="btn ghost" id="fClose">Cerrar</button>`}
    <div class="note">Tu ubicación solo se comparte mientras tienes una plaza publicada o apartada, y se borra al terminar. Relevo es un acuerdo entre conductores: no es una reserva oficial y no se cobra nada.</div>`;
  o.style.display = "block";
  $("#fSave").onclick = () => {
    const name = $("#fName").value.trim();
    if (!name){ toast("Pon al menos tu nombre"); return; }
    me = { id: me?.id || crypto.randomUUID(), name,
      car: { modelo: $("#fModelo").value.trim(), color: $("#fColor").value.trim(),
             matricula: $("#fMat").value.trim().toUpperCase(), tamano: $("#fTam").value } };
    store.set("me", me); o.style.display = "none"; render();
  };
  $("#fClose") && ($("#fClose").onclick = () => o.style.display = "none");
}
$("#profileChip").onclick = () => showProfile(false);

/* ---------- Arranque ---------- */
function init(){
  if (CONFIG.SUPABASE_URL && CONFIG.SUPABASE_ANON_KEY && window.supabase){
    sb = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);
  }
  if (!me) showProfile(true);
  startGPS();
  render();
  if (sb){
    loadPlazas();
    pollTimer = setInterval(() => { if (!document.hidden) loadPlazas(); }, CONFIG.POLL_MS);
    document.addEventListener("visibilitychange", () => { if (!document.hidden) loadPlazas(); });
  }
  setInterval(render, 30000); // refresca los "sale en X min"
}
init();
</script>
</body>
